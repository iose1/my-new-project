<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cool Demo</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding-top: 10%; }
        h1 { font-size: 3rem; animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { text-shadow: 0 0 5px #0f0; }
            50% { text-shadow: 0 0 20px #0f0, 0 0 30px #0f0; }
            100% { text-shadow: 0 0 5px #0f0; }
        }
    </style>
</head>
<body>
    <h1>Hello, Hermes!</h1>
    <p>This is a cool demo created by the Hermes Agent.</p>
</body>
</html>
